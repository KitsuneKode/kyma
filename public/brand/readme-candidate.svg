<svg width="1400" height="820" viewBox="0 0 1400 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kyma candidate flow preview">
  <defs>
    <linearGradient id="candidate-bg" x1="0" y1="0" x2="1400" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="candidate-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 260) rotate(90) scale(360)">
      <stop stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="820" fill="url(#candidate-bg)"/>
  <rect width="1400" height="820" fill="url(#candidate-glow)"/>
  <text x="96" y="110" fill="#E8FF47" font-family="Outfit, ui-sans-serif, sans-serif" font-size="16" font-weight="700" letter-spacing="0.18em">CANDIDATE FLOW</text>
  <text x="96" y="180" fill="#E8E3DA" font-family="Outfit, ui-sans-serif, sans-serif" font-size="56" font-weight="700" letter-spacing="-0.04em">Join, check, interview</text>
  <text x="96" y="240" fill="#8E8A83" font-family="Outfit, ui-sans-serif, sans-serif" font-size="24" font-weight="500">Invite-link entry with device readiness and a guided live session.</text>
  <rect x="96" y="300" width="360" height="420" rx="28" fill="#141414" stroke="#2A2A2A"/>
  <text x="124" y="350" fill="#E8E3DA" font-family="Outfit, ui-sans-serif, sans-serif" font-size="22" font-weight="700">1. Invite access</text>
  <rect x="124" y="372" width="304" height="56" rx="16" fill="#1C1C1C"/>
  <text x="144" y="408" fill="#8E8A83" font-family="IBM Plex Mono, monospace" font-size="16">kyma.kitsunelabs.xyz/i/...</text>
  <text x="124" y="470" fill="#E8E3DA" font-family="Outfit, ui-sans-serif, sans-serif" font-size="22" font-weight="700">2. Readiness check</text>
  <circle cx="154" cy="520" r="18" fill="#252525" stroke="#10B981" stroke-width="3"/>
  <text x="188" y="528" fill="#E8E3DA" font-family="Outfit, ui-sans-serif, sans-serif" font-size="18" font-weight="600">Microphone ready</text>
  <text x="124" y="590" fill="#E8E3DA" font-family="Outfit, ui-sans-serif, sans-serif" font-size="22" font-weight="700">3. Live interview</text>
  <path d="M 124 640 L 124 690 M 150 655 L 150 675 M 176 635 L 176 695 M 202 650 L 202 680 M 228 625 L 228 705" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
  <text x="260" y="670" fill="#8E8A83" font-family="Outfit, ui-sans-serif, sans-serif" font-size="18">Guided conversation + teaching simulation</text>
  <rect x="520" y="300" width="784" height="420" rx="32" fill="#F4EFE4" stroke="#D2CBBB"/>
  <rect x="552" y="332" width="720" height="48" rx="24" fill="#E6E4D7"/>
  <text x="580" y="364" fill="#1E1E1E" font-family="Outfit, ui-sans-serif, sans-serif" font-size="18" font-weight="600">You are live with the Kyma interviewer</text>
  <rect x="552" y="410" width="500" height="88" rx="22" fill="#FFFFFF" stroke="#D2CBBB"/>
  <text x="580" y="452" fill="#1E1E1E" font-family="Outfit, ui-sans-serif, sans-serif" font-size="22" font-weight="600">Explain how you would teach fractions</text>
  <text x="580" y="482" fill="#5E5A52" font-family="Outfit, ui-sans-serif, sans-serif" font-size="16">to a student who is feeling stuck.</text>
  <rect x="552" y="530" width="220" height="150" rx="24" fill="#FFFFFF" stroke="#D2CBBB"/>
  <circle cx="662" cy="590" r="34" fill="#2E2E2E"/>
  <path d="M 650 590 L 662 602 L 682 572" stroke="#E8FF47" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="620" y="648" fill="#5E5A52" font-family="Outfit, ui-sans-serif, sans-serif" font-size="16" font-weight="600">Session captured</text>
  <rect x="800" y="530" width="472" height="150" rx="24" fill="#FFFFFF" stroke="#D2CBBB"/>
  <text x="828" y="572" fill="#1E1E1E" font-family="Outfit, ui-sans-serif, sans-serif" font-size="20" font-weight="700">Calm, respectful candidate experience</text>
  <text x="828" y="608" fill="#5E5A52" font-family="Outfit, ui-sans-serif, sans-serif" font-size="16">About 15-20 minutes | browser-based | no install</text>
  <rect x="828" y="630" width="180" height="34" rx="17" fill="#E8FF47"/>
  <text x="852" y="653" fill="#0A0A0A" font-family="Outfit, ui-sans-serif, sans-serif" font-size="14" font-weight="700">Invite-only access</text>
</svg>
